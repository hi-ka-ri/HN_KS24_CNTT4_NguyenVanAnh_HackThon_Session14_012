spring.application.name=HN_KS24_CNTT4_NguyenVanAnh_HackThon_Session14_012

# =========================
# DATASOURCE
# =========================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/db_api_ss16_MockHackThon?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true

# =========================
# LOGGING
# =========================

logging.level.root=INFO

logging.level.com.example.library=DEBUG

logging.level.org.springframework=WARN

logging.file.name=logs/application.log

logging.logback.rollingpolicy.max-history=30

logging.logback.rollingpolicy.max-file-size=100MB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{39} %msg%n